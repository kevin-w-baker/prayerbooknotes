baseURL: 'https://dailyoffice.prayerbooknotes.page/'
languageCode: 'en-us'
title: 'Prayer Book Notes'
theme: 'PrayerBook79'

# Pagination
pagination:
  pagerSize: 10

# Enable features
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

# Minification
minify:
  disableXML: true
  minifyOutput: true

# Menu configuration
menu:
  main:
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 10
    - identifier: about
      name: About
      url: /about/
      weight: 20

# PaperMod specific params
params:
  env: production
  title: "Prayer Book Notes"
  description: "Notes in the margins of the prayer book."
  keywords: [Daily Office, Book of Common Prayer, Episcopal Church, Morning Prayer, Evening Prayer]
  author: "Kevin Baker"

  # Theme mode
  defaultTheme: light
  disableThemeToggle: true

  # Typography and features
  ShowReadingTime: false
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: false
  ShowWordCount: false
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true

  # Home page
  homeInfoParams:
    Title: "The Daily Office"
    Content: "Thoughts and fragments on the daily prayer of Christ's church"

  # Social icons
  socialIcons:
    - name: rss
      url: "/index.xml"

# Taxonomies
taxonomies:
  category: categories
  tag: tags
  series: series

# Output formats
outputs:
  home:
    - HTML
    - RSS
    - JSON
